<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4d6647" />
    <meta name="description" content="Diario personal de oración y lectura bíblica." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Diario de Crecimiento Espiritual</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const showStartupError = (message) => {
          const root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML = `<main style="font-family:system-ui,sans-serif;padding:24px;max-width:720px;margin:auto"><h1>No se pudo iniciar la aplicación</h1><p>Ocurrió un error antes de cargar la interfaz.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${String(message)}</pre></main>`;
        };
        window.addEventListener('error', (event) => showStartupError(event.message || 'Error de carga'));
        window.addEventListener('unhandledrejection', (event) => showStartupError(event.reason?.message || event.reason || 'Error de carga'));
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
